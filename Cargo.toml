[package]
name = "rusbee"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
clap = { version = "4.5.37", features = ["derive"] }
clap_complete = "4.5.50"
crossterm = "0.29.0"
env_logger = "0.11.8"
inquire = "0.7.5"
log = "0.4.27"
ratatui = "0.29.0"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tabled = "0.20.0"
tokio = { version = "1.44.2", features = ["macros", "net", "process", "rt-multi-thread"] }
toml = "0.8.22"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
